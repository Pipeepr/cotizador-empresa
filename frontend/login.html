<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CotizaPro - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <div class="login-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <h1>Acceso Seguro</h1>
        <p>Inicia sesión con tu cuenta de Google</p>

        <div class="error-msg" id="error-msg"></div>

        <div id="google-btn" style="margin-top: 20px; display: flex; justify-content: center;"></div>
    </div>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        function handleCredentialResponse(response) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';

            // El token ID de google
            const id_token = response.credential;

            fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: id_token })
            })
            .then(res => {
                if (!res.ok) throw new Error('Error al autenticar');
                return res.json();
            })
            .then(data => {
                window.location.href = '/';
            })
            .catch(err => {
                errorMsg.textContent = 'Hubo un error al iniciar sesión con Google';
                errorMsg.style.display = 'block';
            });
        }

        window.onload = function () {
            // El mismo Client ID que usamos para enviar correos
            const CLIENT_ID = '360557152471-b270feg6rv0nm39l04geqjkjlosbtv3n.apps.googleusercontent.com';

            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                document.getElementById("google-btn"),
                { theme: "outline", size: "large", width: "100%" }
            );
            
            google.accounts.id.prompt(); // Muestra el One Tap dialog si está disponible
        };
    </script>
</body>
</html>
